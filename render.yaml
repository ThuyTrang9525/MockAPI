services:
  - type: web
    name: trangspecial
    env: php
    runtime: docker
    plan: free
    repo: https://github.com/ThuyTrang9525/MockAPI.git
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/database.sqlite
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force
    startCommand: "php-fpm -D && nginx -g 'daemon off;'"
