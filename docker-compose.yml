version: '3.8'

services:
  laravel_db:
    image: mysql:8.0
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" # Port ngoài là 3307, port trong container vẫn là 3306
    networks:
      - laravel_network

  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    depends_on:
      - laravel_db
    networks:
      - laravel_network

  laravel_nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "8000:80"
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge
